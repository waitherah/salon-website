<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book an Appointment — Glam & Glow.</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="wordmark">Glam &amp; Glow.<small>Beauty parlour</small></a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav">Menu</button>
      <nav class="site-nav" id="site-nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a href="my-bookings.html">My Bookings</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
      <a href="booking.html" class="btn btn-primary header-cta">Book Appointment</a>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-head">
          <h1>Book an appointment</h1>
          <p>Fill in your details below. You'll see the booking instantly under "My Bookings".</p>
        </div>

        <form id="booking-form" novalidate>
          <div class="form-grid">
            <div>
              <label for="name">Full name</label>
              <input type="text" id="name" name="name" />
              <div class="field-error" data-for="name"></div>
            </div>
            <div>
              <label for="email">Email</label>
              <input type="email" id="email" name="email" />
              <div class="field-error" data-for="email"></div>
            </div>
            <div>
              <label for="phone">Phone number</label>
              <input type="tel" id="phone" name="phone" placeholder="07XX XXX XXX" />
              <div class="field-error" data-for="phone"></div>
            </div>
            <div>
              <label for="service">Service</label>
              <select id="service" name="service">
                <option value="">Choose a service</option>
                <option>Knotless Braids</option>
                <option>Wig Install</option>
                <option>Conrows</option>
                <option>Twists</option>
                <option>Classic Manicure</option>
                <option>Pedicure</option>
                <option>Signature facial</option>
              </select>
              <div class="field-error" data-for="service"></div>
            </div>
            <div>
              <label for="stylist">Stylist</label>
              <select id="stylist" name="stylist">
                <option value="">Choose a stylist</option>
                <option>Amara</option>
                <option>Faith</option>
                <option>Joy</option>
              </select>
              <div class="field-error" data-for="stylist"></div>
            </div>
            <div>
              <label for="date">Date</label>
              <input type="date" id="date" name="date" />
              <div class="field-error" data-for="date"></div>
            </div>
            <div>
              <label for="time">Time</label>
              <input type="time" id="time" name="time" />
              <div class="field-error" data-for="time"></div>
            </div>
            <div class="full">
              <label for="notes">Anything we should know? (optional)</label>
              <textarea id="notes" name="notes"></textarea>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Confirm Booking</button>
            <button type="button" id="whatsapp-btn" class="whatsapp-btn" aria-label="WhatsApp">
              <svg viewBox="0 0 24 24">
                <path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.1-1.3A10 10 0 1 0 12 2zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 20z"/>
                <path d="M16.7 13.6c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1s-.7.8-.9 1-.3.2-.6.1a6.6 6.6 0 0 1-2-1.2 7.3 7.3 0 0 1-1.3-1.7c-.1-.2 0-.4.1-.5l.4-.4.2-.4a.5.5 0 0 0 0-.4c-.1-.1-.6-1.4-.8-1.9s-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 12 12 0 0 0 4.6 4c.6.3 1.1.4 1.5.6a3.6 3.6 0 0 0 1.7.1 2.8 2.8 0 0 0 1.8-1.3c.2-.4.2-.7.1-1s-.2-.2-.4-.3z"/>
              </svg>
            </button>
          </div>

          <div class="form-status" id="form-status"></div>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>&copy; 2026 Glam &amp; Glow.</span>
      <span>12 Moi Avenue, Nairobi · Mon–Sat, 9am–7pm</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
